<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Midst of Winter</title>
<meta property="og:title" content="The Midst of Winter">
<meta property="og:description" content="Sunday 6 December, 3 PM onwards. Warm drinks and baked goods aplenty.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #5C1519;
    --card: #7A1E22;
    --gold: #EBCB82;
    --gold-soft: rgba(235, 203, 130, 0.55);
    --ink: #F6EAD0;
    --ink-soft: #EBDDBE;
    --snow: #FFF6E6;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .card {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 600px;
    background: var(--card);
    padding: 72px 48px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 44px;
    overflow: hidden;
  }
  .snow { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .flake {
    position: absolute;
    top: -12px;
    border-radius: 50%;
    background: var(--snow);
    animation: fall var(--dur) linear var(--delay) infinite;
  }
  @keyframes fall {
    from { transform: translate3d(0, 0, 0); }
    50%  { transform: translate3d(var(--drift), calc(var(--h) / 2), 0); }
    to   { transform: translate3d(0, calc(var(--h) + 24px), 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .flake { animation: none; top: var(--rest); }
  }
  .frame { position: absolute; pointer-events: none; border: 1.5px solid var(--gold); inset: 22px; }
  .frame.inner { inset: 30px; border-width: 1px; border-color: var(--gold-soft); }
  .corner { position: absolute; width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); }
  .corner.tl { top: 17px; left: 17px; } .corner.tr { top: 17px; right: 17px; }
  .corner.bl { bottom: 17px; left: 17px; } .corner.br { bottom: 17px; right: 17px; }

  .star { width: min(300px, 70vw); height: auto; display: block; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(36px, 8vw, 46px); line-height: 1.05; }
  .details { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-soft); }
  .when { font-family: var(--serif); font-size: 26px; line-height: 1.2; color: var(--gold); margin-bottom: 8px; }
  .aside { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--gold); }
  .aside.first { margin-top: 12px; }
  .deadline { margin-top: 16px; font-size: 15px; letter-spacing: 0.06em; }

  form { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .choice {
    font: 500 16px/1.3 var(--sans);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--gold-soft);
    padding: 14px 10px;
    cursor: pointer;
  }
  .choice[aria-pressed="true"] { background: var(--gold); color: #4A1013; border-color: var(--gold); }
  label { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: 15px; color: var(--ink-soft); }
  input, textarea {
    font: 400 17px/1.4 var(--sans);
    color: var(--ink);
    background: rgba(0, 0, 0, 0.18);
    border: 1px solid var(--gold-soft);
    padding: 12px 14px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 72px; }
  input::placeholder, textarea::placeholder { color: rgba(246, 234, 208, 0.5); }
  .send {
    font: 500 17px/1 var(--sans);
    color: #4A1013;
    background: var(--gold);
    border: none;
    padding: 16px;
    cursor: pointer;
  }
  .send:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--snow); outline-offset: 3px; }
  .status { min-height: 1.5em; margin: 0; font-size: 15px; color: var(--ink-soft); }
  .thanks { font-family: var(--serif); font-size: 26px; line-height: 1.3; color: var(--gold); margin: 0; }
  .footnote { margin: 8px 0 0; font-family: var(--serif); font-style: italic; font-size: 13px; }
  .footnote a { color: var(--gold-soft); text-decoration: none; border-bottom: 1px dotted var(--gold-soft); }
  .footnote a:hover { color: var(--gold); border-bottom-color: var(--gold); }
  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    body { padding-left: 10px; padding-right: 10px; }
    .card { padding: 60px 30px 56px; gap: 36px; }
    .when { font-size: 23px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="snow" id="snow" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="frame inner" aria-hidden="true"></div>
  <div class="corner tl" aria-hidden="true"></div><div class="corner tr" aria-hidden="true"></div>
  <div class="corner bl" aria-hidden="true"></div><div class="corner br" aria-hidden="true"></div>

  <svg class="star" viewBox="-150 -150 300 300" fill="none" stroke="#EBCB82" stroke-linecap="round" aria-hidden="true">
    <g stroke-width="2.2">
      <path d="M0,-140 L0,140"/><path d="M-140,0 L140,0"/>
      <path d="M-99,-99 L99,99"/><path d="M-99,99 L99,-99"/>
    </g>
    <g stroke-width="1.4">
      <path d="M-34,-82 L34,82"/><path d="M34,-82 L-34,82"/>
      <path d="M-82,-34 L82,34"/><path d="M-82,34 L82,-34"/>
    </g>
    <g stroke-width="1.6">
      <path d="M-14,-62 L0,-48 L14,-62"/><path d="M-14,62 L0,48 L14,62"/>
      <path d="M-62,-14 L-48,0 L-62,14"/><path d="M62,-14 L48,0 L62,14"/>
      <path d="M-34,-54 L-34,-34 L-54,-34"/><path d="M34,54 L34,34 L54,34"/>
      <path d="M34,-54 L34,-34 L54,-34"/><path d="M-34,54 L-34,34 L-54,34"/>
    </g>
    <rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" stroke-width="2.2"/>
  </svg>

  <h1>The Midst of Winter</h1>

  <div class="details">
    <span class="when">Sunday 6 December · 3 PM onwards</span>
    <span>Address on your invitation, or just ask</span>
    <span class="aside first">Warm drinks and good company</span>
    <span class="aside">Baked goods aplenty, and welcome</span>
    <span class="deadline">RSVP by 28 November</span>
  </div>

  <form id="rsvp" novalidate>
    <div class="choices" role="group" aria-label="Your answer">
      <button type="button" class="choice" data-answer="Coming" aria-pressed="false">I’ll be there</button>
      <button type="button" class="choice" data-answer="Can’t make it" aria-pressed="false">Can’t make it</button>
    </div>
    <label>Your name
      <input type="text" id="name" name="name" autocomplete="name" required>
    </label>
    <label>Anything to add? (optional)
      <textarea id="note" name="note" placeholder="Bringing someone, bringing a bake…"></textarea>
    </label>
    <button type="submit" class="send" id="send">Send RSVP</button>
    <p class="status" id="status" role="status"></p>
  </form>
  <p class="thanks" id="thanks" role="status" hidden></p>
  <p class="footnote"><a href="https://www.radiofrance.fr/franceculture/podcasts/3-minutes-de-philosophie-pour-redevenir-humain/camus-ecrivait-au-milieu-de-l-hiver-j-ai-decouvert-en-moi-un-invincible-ete-8066395" target="_blank" rel="noopener">In the midst of winter, an invincible summer</a></p>
</main>

<script>

  // Falling snow
  (function () {
    const layer = document.getElementById('snow');
    const card = layer.parentElement;
    const setHeight = () => card.style.setProperty('--h', card.offsetHeight + 'px');
    setHeight();
    window.addEventListener('resize', setHeight);
    new ResizeObserver(setHeight).observe(card);
    for (let i = 0; i < 70; i++) {
      const f = document.createElement('span');
      const size = [2.4, 3.2, 4, 5.2, 6.4][Math.floor(Math.random() * 5)];
      const dur = 10 + Math.random() * 14;
      f.className = 'flake';
      f.style.cssText =
        'left:' + (Math.random() * 100) + '%;' +
        'width:' + size + 'px;height:' + size + 'px;' +
        'opacity:' + (0.2 + Math.random() * 0.45).toFixed(2) + ';' +
        '--dur:' + dur.toFixed(1) + 's;' +
        '--delay:-' + (Math.random() * dur).toFixed(1) + 's;' +
        '--drift:' + ((Math.random() - 0.5) * 40).toFixed(0) + 'px;' +
        '--rest:' + (Math.random() * 100).toFixed(0) + '%;';
      layer.appendChild(f);
    }
  })();

  // Formspree form ID (the part after formspree.io/f/)
  const FORMSPREE_ID = 'xnpprzqa';

  const form = document.getElementById('rsvp');
  const choices = form.querySelectorAll('.choice');
  const statusEl = document.getElementById('status');
  const sendBtn = document.getElementById('send');
  let answer = '';

  choices.forEach((btn) => {
    btn.addEventListener('click', () => {
      answer = btn.dataset.answer;
      choices.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      statusEl.textContent = '';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const note = document.getElementById('note').value.trim();
    if (!answer) { statusEl.textContent = 'Choose “I’ll be there” or “Can’t make it” first.'; return; }
    if (!name) { statusEl.textContent = 'Add your name so we know who’s replying.'; document.getElementById('name').focus(); return; }

    sendBtn.disabled = true;
    statusEl.textContent = 'Sending…';
    try {
      const res = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ event: 'The Midst of Winter', response: answer, name, note, _subject: 'Midst of Winter RSVP: ' + name + ' (' + answer + ')' })
      });
      if (!res.ok) throw new Error('Request failed');
      form.hidden = true;
      const thanks = document.getElementById('thanks');
      thanks.textContent = answer === 'Coming'
        ? 'Thanks, ' + name + '. See you on the 6th.'
        : 'Thanks, ' + name + '. Next time!';
      thanks.hidden = false;
    } catch (err) {
      sendBtn.disabled = false;
      statusEl.textContent = 'Your RSVP didn’t go through. Check your connection and try again.';
    }
  });
</script>
</body>
</html>
